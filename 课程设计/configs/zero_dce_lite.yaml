project:
  name: Zero-DCE-Lite
  seed: 42
  device: cuda

data:
  root: datasets
  split_file: splits/lol_v1_seed42.json

training:
  epochs: 50
  patch_size: 256
  batch_size: 2
  num_workers: 0
  lr: 0.0002
  weight_decay: 0.000001
  use_amp: true

model:
  variant: zero_dce_lite
  channels: 32
  num_iterations: 8

loss:
  lambda_ssim: 0.5
  lambda_tv: 0.05

outputs:
  output_dir: outputs
  checkpoint_dir: outputs/checkpoints
  result_dir: outputs/results
  best_checkpoint: outputs/checkpoints/zero_dce_lite_best.pt
